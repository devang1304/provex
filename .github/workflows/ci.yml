name: ci
on:
  push:
  pull_request:

jobs:
  tests:
    # builds the Docker image (pinned CPU wheels) and runs the test suite inside it
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t provex:ci .
      - run: docker run --rm provex:ci

  paper:
    # tables generated from empty results give "n/a"; compiling checks that every macro the paper uses exists
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: |
          mkdir -p /tmp/empty-results
          python scripts/make_tables.py --results /tmp/empty-results --out paper/generated
          python scripts/make_case_studies.py --results /tmp/empty-results --out paper/generated
      - uses: xu-cheng/latex-action@v3
        with:
          root_file: provex_v2.tex
          working_directory: paper